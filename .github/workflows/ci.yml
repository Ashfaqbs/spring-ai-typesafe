name: CI

on:
  pull_request: {}

jobs:
  build:
    name: Build branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # No TYPESAFE_API_KEY here on purpose: `mvn verify` runs the offline suite only.
      # The *IT tests are behind the integration-tests profile because they call the real
      # Jev API and cost tokens, so they are not run for every pull request.
      - name: Build
        run: mvn verify
